<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            border: 3px solid;
            width: 700px;
            height: 400px;
            animation-name: bounce;
            animation-duration: 2s;
            animation-iteration-count: 2;
        }
        div::before{
            
        }
        @keyframes bounce {
            from{
                background-color: rgb(255, 255, 255);
            }
            to{
                background-color: orangered;
            }
        }
        img{
            height: 100%;
            width: 100%;
        }
        
    </style>
</head>
<body>
    <h1>Siddhartha</h1>
    <div id="A" class="box">
        <!-- <img src="https://preview.colorlib.com/theme/allfood/assets/img/hero/h1_hero.png" alt=""> -->
    </div>
    <h2>Apple</h2>
</body>
